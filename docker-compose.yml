# Local development services only. Credentials here are for a throwaway local database.
services:
  postgres:
    image: postgres:16.4
    environment:
      POSTGRES_USER: roboshare
      POSTGRES_PASSWORD: roboshare-local-only
      POSTGRES_DB: roboshare
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7.4.1
    ports: ["6379:6379"]
volumes:
  pgdata: {}
