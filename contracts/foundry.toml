[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.30"
offline = true
# BSC supports Cancun opcodes since its 2024 hard forks; re-verify on chain 97 before deployment.
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]

[fuzz]
runs = 1000

[invariant]
runs = 64
depth = 64
fail_on_revert = false

[profile.ci.fuzz]
runs = 10000

[profile.ci.invariant]
runs = 256
depth = 128

[lint]
# Immutables are part of the public getter API (e.g. token(), projectId()); keep camelCase.
exclude_lints = ["screaming-snake-case-immutable", "asm-keccak256"]
